name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Check the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Pack and verify the tarball
        run: |
          npm pack --pack-destination /tmp
          VERSION=$(node -p "require('./package.json').version")
          tar -tzf "/tmp/onelastcommit-onenote-mcp-$VERSION.tgz" | sort > /tmp/contents.txt
          cat /tmp/contents.txt
          for REQUIRED in \
            package/package.json \
            package/README.md \
            package/LICENSE \
            package/dist/cli.js \
            package/dist/index.js \
            package/dist/index.d.ts \
            package/dist/config.js \
            package/dist/markdown.js \
            package/dist/auth/index.js \
            package/dist/graph/client.js \
            package/dist/http/server.js \
            package/dist/tools/index.js
          do
            if ! grep -qx "$REQUIRED" /tmp/contents.txt; then
              echo "Missing from the tarball: $REQUIRED" >&2
              exit 1
            fi
          done

      # Trusted publishing (OIDC) needs npm 11.5.1+; setup-node ships npm 10 with Node 20.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish
        run: npm publish --access public

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
